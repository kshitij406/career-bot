# Portal scanner configuration — consumed by src/scan.py.
#
# Only public ATS JSON/XML APIs. No Indeed, no LinkedIn — ever. Provider is
# auto-detected from careers_url:
#   greenhouse:       job-boards(.eu)?.greenhouse.io/<slug>   -> boards-api.greenhouse.io/v1/boards/<slug>/jobs
#   ashby:            jobs.ashbyhq.com/<slug>                 -> api.ashbyhq.com/posting-api/job-board/<slug>
#   lever:            jobs.lever.co/<slug>                    -> api.lever.co/v0/postings/<slug>
#   smartrecruiters:  careers.smartrecruiters.com/<slug>      -> api.smartrecruiters.com/v1/companies/<slug>/postings
#   workable:         apply.workable.com/<slug>                -> apply.workable.com/api/v1/widget/accounts/<slug>
#   personio:         <slug>.jobs.personio.(com|de)           -> <slug>.jobs.personio.(com|de)/xml
#   workday:          <tenant>.<wdN>.myworkdayjobs.com/<site>  -> <tenant>.<wdN>.myworkdayjobs.com/wday/cxs/<tenant>/<site>/jobs
#                     (workday's own embedded job-search widget calls this same JSON endpoint;
#                     stable and unauthenticated, but not officially documented the way the others are)
#   recruitee:        <slug>.recruitee.com                     -> <slug>.recruitee.com/api/offers
#                     (custom-domain Recruitee boards are also auto-detected: if a careers_url
#                     doesn't match any pattern above, src/scan.py probes <domain>/api/offers
#                     and treats it as Recruitee if the response has an "offers" key)
#   breezy:           <slug>.breezy.hr                         -> <slug>.breezy.hr/json?verbose=true
#                     (verbose=true is mandatory — without it postings have no description)
#
# Evaluated and excluded: Teamtailor and Comeet/Spark Hire Recruit both
# require an employer-issued key/token that isn't derivable from careers_url
# alone, breaking the auto-detect model above.
#
# All slugs below were verified live on 2026-07-15/16.

# Keyword pre-filter applied BEFORE scoring (src/score.py).
# A title must match >=1 role keyword, >=1 positive/framing keyword, and 0
# negative keywords (case-insensitive substring). role_keywords is what keeps
# non-tech placements (e.g. "Management Accountant - 12 Month FTC") out —
# without it, any title matching only a framing keyword would pass.
title_filter:
  role_keywords:
    - engineer
    - engineering
    - developer
    - development
    - software
    - programmer
    - programming
    - "computer science"
    - "computer engineering"
    - backend
    - "back end"
    - frontend
    - "front end"
    - "full stack"
    - "full-stack"
    - devops
    - "machine learning"
    - "data scientist"
    - "data engineer"
    - "data engineering"
    - "data analyst"
    - cloud
    - infrastructure
    - "quality assurance"
    - qa
    - sre
    - cyber
    - security
    - technology
    - technical
    - systems
    - network
  positive:
    - intern
    - internship
    - placement
    - "placement year"
    - "work placement"
    - "placement scheme"
    - "placement programme"
    - "placement program"
    - industrial
    - "industrial year"
    - "industrial placement"
    - "year in industry"
    - sandwich
    - "sandwich year"
    - "sandwich placement"
    - "sandwich student"
    - "thick sandwich"
    - "year out"
    - "gap year placement"
    - undergraduate
    - co-op
    - "12 month"
    - "12-month"
    - "13 month"
    - "13-month"
    - "44 week"
    - "44-week"
    - apprentice
    - "early careers"
    - "student"
  negative:
    - senior
    - staff
    - principal
    - lead
    - head of
    - director
    - manager
    - phd
    - postdoc
    - recruiter
    - marketing
    - sales
    - legal
    - finance intern
    - hr

