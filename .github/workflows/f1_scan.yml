name: f1-scan

on:
  schedule:
    - cron: "37 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  f1-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python tests/test_f1_pipeline.py

      - name: Run F1 scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m src.f1_run

      - name: Commit seen_f1.json if changed
        run: |
          git config user.name "career-bot"
          git config user.email "career-bot@users.noreply.github.com"
          git add seen_f1.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update seen_f1.json [skip ci]"
            git push
          fi
